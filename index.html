<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Object Detector</title></head>
<body style="font-family:Arial;max-width:800px;margin:30px auto;text-align:center">
  <h2>Video Object Detection</h2>
  <input type="file" id="f" accept="video/*">
  <button onclick="go()">Detect</button>
  <p id="s"></p>
  <video id="v" controls width="100%" style="display:none"></video>
  <br><a id="d" download="result.mp4" style="display:none">Download result</a>
<script>
async function go(){
  const file = document.getElementById("f").files[0];
  if(!file){ alert("Pehle video chuno"); return; }
  const s = document.getElementById("s");
  s.innerText = "Processing... thoda wait karo (CPU par kuch minute lagte hain)";
  const fd = new FormData(); fd.append("file", file);
  try{
    const res = await fetch("http://127.0.0.1:8000/detect", {method:"POST", body:fd});
    const url = URL.createObjectURL(await res.blob());
    const v = document.getElementById("v"); v.src = url; v.style.display = "block";
    const d = document.getElementById("d"); d.href = url; d.style.display = "inline";
    s.innerText = "Ho gaya!";
  }catch(e){ s.innerText = "Error: server chal raha hai?"; }
}
</script>
</body>
</html>
